{% extends "layout.html" %}

{% block title %}Etsi kirja-arvostelu{% endblock %}

{% block content %}
<h2>Etsi kirja-arvostelu</h2>

<form action="/find_book" method="get">
    <p>
        <label for="query">Hakusana:</label>
        <input type="text" name="query" id="query" value="{{ query }}">
    </p>
    <input type="submit" value="Lähetä">
</form>

{% if query %}
<h3>Tulokset</h3>

<ul>
    {% for book in results %}
    <li><a href="/book/{{ book.id }}">{{ book.title }}</a></li>
    {% endfor %}
</ul>
    {% endif %}
{% endblock %}
