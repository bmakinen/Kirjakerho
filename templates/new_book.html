{% extends "layout.html" %}

{% block title %}Uusi kirja-arvostelu{% endblock %}

{% block content %}
<h2>Uusi kirja-arvostelu</h2>
<form action="/create_book" method="post">
  <p>
    Kirjan nimi: <br />
    <input type="text" name="title" maxlength="50" />
  </p>
  <p>
    Kirjailija: <br />
    <input type="text" name="author" maxlength="50"/>
  </p>

  {% for class in classes %}
  <p>
    {{ class }}: <br />
    <select name="classes">
      <option value="">valitse</option>
    {% for option in classes[class] %}
      <option value="{{ class }}:{{ option }}">{{ option }}</option>
    {% endfor %}
    </select>
  </p>
  {% endfor %}

  <p>
    Arvostelu: <br />
    <textarea name="review" rows="8" cols="80" maxlength="1000"></textarea>
  </p>
  <input type="submit" value="Luo arvostelu" />
</form>
{% endblock %}
