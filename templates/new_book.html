{% extends "layout.html" %}

{% block title %}Uusi kirja-arvostelu{% endblock %}

{% block content %}
<h2>Uusi kirja-arvostelu</h2>
<form action="/create_book" method="post">
  <p>
    <label for="title">Kirjan nimi:</label> <br />
    <input type="text" name="title" id="title" maxlength="50" />
  </p>
  <p>
    <label for="author">Kirjailija:</label> <br />
    <input type="text" name="author" id="author" maxlength="50"/>
  </p>

  {% for class in classes %}
  <p>
    <label for="class{{ class }}">{{ class }}</label> <br />
    <select name="classes" id="class{{ class }}">
      <option value="">valitse</option>
    {% for option in classes[class] %}
      <option value="{{ class }}:{{ option }}">{{ option }}</option>
    {% endfor %}
    </select>
  </p>
  {% endfor %}

  <p>
    <label for="review">Arvostelu:</label> <br />
    <textarea name="review" id="review" rows="8" cols="80" maxlength="1000"></textarea>
  </p>
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" value="Luo arvostelu" />
</form>
{% endblock %}
