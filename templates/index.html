{% extends "layout.html" %}

{% block title %}Kirjakerho{% endblock %}

{% block content %}
<h2>Kirja-arvostelut</h2>


{% for book in books %}
<div class="/book">
<a href="/book/{{ book.id }}">{{ book.title }}</a> <br />
Kirjailija: {{ book.author }} <br />
Arvostelija: <a href="/user/{{ book.user_id }}">{{ book.username }}</a>
</div>
{% endfor %}
{% endblock %}
