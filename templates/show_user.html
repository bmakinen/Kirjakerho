{% extends "layout.html" %}

{% block title %}Käyttäjä {{user.username}}{% endblock %}

{% block content %}
<h2>Käyttäjä {{ user.username }}</h2>
<p>
    Käyttäjällä on yhteensä {{ books | count }} arvostelua.
</p>
<h3>Arvostelut</h3>
<ul>
    {% for book in books %}
    <li><a href="/book/{{ book.id }}">{{ book.title }}</a></li>
    {% endfor %}
</ul>
{% endblock %}
